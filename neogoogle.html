<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoBrowser Search &amp; Web Engine</title>
<style>
:root {
    --bg-base: #09090b;
    --bg-surface: #121218;
    --bg-surface-elevated: #1a1a24;
    --border-subtle: rgba(255, 255, 255, 0.1);
    --primary: #8b5cf6;
    --accent: #38bdf8;
    --text-main: #f4f4f5;
    --text-muted: #a1a1aa;
    --radius-md: 14px;
    --radius-full: 9999px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
                var(--bg-base);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    overflow: hidden;
}

.brand {
    text-align: center;
    margin-bottom: 32px;
}
.brand-title {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #c084fc 0%, #a855f7 40%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.4));
    margin-bottom: 8px;
}
.brand-subtitle {
    font-size: 15px;
    color: var(--text-muted);
}

.search-card {
    width: 100%;
    max-width: 680px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 32px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.mode-tabs {
    display: flex;
    gap: 8px;
    background: var(--bg-surface-elevated);
    padding: 4px;
    border-radius: var(--radius-full);
    border: 1px solid var(--border-subtle);
}
.mode-btn {
    flex: 1;
    padding: 8px 16px;
    border-radius: var(--radius-full);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
}
.mode-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 10px rgba(139, 92, 246, 0.4);
}

.input-wrap {
    position: relative;
    width: 100%;
}
.search-input {
    width: 100%;
    height: 52px;
    background: var(--bg-surface-elevated);
    border: 1.5px solid var(--border-subtle);
    border-radius: var(--radius-full);
    padding: 0 24px;
    font-size: 16px;
    color: #fff;
    outline: none;
    transition: all 0.25s;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}
.search-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.35);
}

.action-row {
    display: flex;
    gap: 12px;
    justify-content: center;
}
.submit-btn {
    padding: 12px 28px;
    border-radius: var(--radius-full);
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
    border: none;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
}
.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(124, 58, 237, 0.5);
}

.shortcuts-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
}
</style>
</head>
<body>

<div class="brand">
    <div class="brand-title">NeoSearch Engine</div>
    <div class="brand-subtitle">Unified Search for Decentralized .Neo Sites and Google Web</div>
</div>

<div class="search-card">
    <div class="mode-tabs">
        <button class="mode-btn active" id="tab-google"><i class="bi bi-globe2"></i> Google Web Search</button>
        <button class="mode-btn" id="tab-neo"><i class="bi bi-lightning-charge"></i> Neo Network Search</button>
    </div>

    <div class="input-wrap">
        <input type="text" class="search-input" id="search-input" placeholder="Search Google..." autofocus>
    </div>

    <div class="action-row">
        <button class="submit-btn" id="submit-btn">Search Now</button>
    </div>

    <div class="shortcuts-hint">
        Press <strong style="color: #fff;">Enter</strong> to search • <strong style="color: #fff;">Ctrl+K</strong> to focus
    </div>
</div>

<script>
const { ipcRenderer } = require('electron');

let currentMode = "google";
const searchInput = document.getElementById('search-input');
const submitBtn = document.getElementById('submit-btn');
const tabGoogle = document.getElementById('tab-google');
const tabNeo = document.getElementById('tab-neo');

tabGoogle.addEventListener('click', () => {
    currentMode = "google";
    tabGoogle.classList.add('active');
    tabNeo.classList.remove('active');
    searchInput.placeholder = "Search Google Web...";
    searchInput.focus();
});

tabNeo.addEventListener('click', () => {
    currentMode = "neo";
    tabNeo.classList.add('active');
    tabGoogle.classList.remove('active');
    searchInput.placeholder = "Search 45+ .neo sites (e.g. 2048, flappy-bird)...";
    searchInput.focus();
});

function doSearch() {
    const q = searchInput.value.trim();
    if (!q) return;

    if (currentMode === "google") {
        ipcRenderer.send('open-external-browser', `https://www.google.com/search?q=${encodeURIComponent(q)}`);
    } else {
        ipcRenderer.send('search', q);
        window.close();
    }
}

searchInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') doSearch();
});
submitBtn.addEventListener('click', doSearch);

document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'k') {
        e.preventDefault();
        searchInput.focus();
    }
});
</script>
</body>
</html>
